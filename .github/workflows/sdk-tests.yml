name: SDK API Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3,10 * * *'

permissions: write-all

env:
  BUILD_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      LOGIN_URL: "https://partner-account-noneu.truecaller.com/v1/account/login"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-     

      - name: Cleanup Report Folder
        run: rm -rf allure-results

      - name: Run SDK Test API Tests
        run: mvn clean test

      - name: Archive allure reports
        uses: actions/upload-artifact@v4
        with:
          name: allure-reports
          path: allure-results

      - name: Upload allure reports to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sdk-allure-reports
          path: allure-results

      - name: Set up Allure
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Allure CLI
        run: npm install -g allure-commandline --save-dev

      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o target/allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/allure-report

      - name: Send build success notification
        if: ${{ success() }}
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
        with:
          channel-id: C04KT3VL9TK
          payload: >
            {
              "attachments": [
                {
                  "color": "good",
                  "text": "SDK APIs Automation Test is Passed: \n${{ env.BUILD_URL }}."
                }
              ]
            }

      - name: Notify Slack on Error
        if: ${{ failure() && !cancelled() }}
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
        with:
          channel-id: C04KT3VL9TK
          payload: >
            {
              "attachments": [
                {
                  "color": "red",
                  "text": "SDK APIs Automation Test is failed: \n${{ env.BUILD_URL }}."
                }
              ]
            }