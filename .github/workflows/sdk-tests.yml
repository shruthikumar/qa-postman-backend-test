name: SDK API Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3,10 * * *'

permissions: write-all

env:
  BUILD_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      LOGIN_URL: "https://partner-account-noneu.truecaller.com/v1/account/login"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-     

      - name: Cleanup Report Folder
        run: rm -rf allure-results

      - name: Run SDK Test API Tests
        run: mvn clean test

      - name: Mask Sensitive Data in Allure Results
        if: always()
        run: |
          echo "Masking sensitive data in allure-results..."
          find allure-results -type f -exec sed -i "s/${EMAIL}/***MASKED_EMAIL***/g" {} +
          find allure-results -type f -exec sed -i "s/${PASSWORD}/***MASKED_PASSWORD***/g" {} +
          find allure-results -type f -exec perl -pi -e 's/Bearer\s+[A-Za-z0-9\._-]+/Bearer ***MASKED_TOKEN***/g' {} +
          find allure-results -type f -exec perl -pi -e 's/"token"\s*:\s*"[A-Za-z0-9\._-]+"/"token":"***MASKED_TOKEN***"/g' {} +
          find allure-results -type f -name "*.html" -exec \
          perl -0777 -pi -e 's/&quot;token&quot;\s*:\s*&quot;.*?&quot;/&quot;token&quot;:&quot;***MASKED_TOKEN***&quot;/gs' {} +

      - name: Archive allure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-reports
          path: allure-results

      - name: Set up Allure
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline --save-dev

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o target/allure-report

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/allure-report

      - name: Extract failed tests from Allure results
        if: failure()
        run: |
          mkdir -p tmp
          grep 'test-method .*status="FAIL"' target/surefire-reports/testng-results.xml | \
          sed -n 's/.*name="\([^"]*\)".*/\1/p' > tmp/failures.txt

          if [ ! -s tmp/failures.txt ]; then
            echo "None" > tmp/failures.txt
          fi

          echo "Contents of tmp/failures.txt:"
          cat tmp/failures.txt

      - name: Prepare Failed Test Cases Content
        if: failure()
        id: prepare_content # Give this step an ID to reference its outputs
        run: |
          ESCAPED_CONTENT=$(sed 's/"/\\"/g' tmp/failures.txt | sed ':a;N;$!ba;s/\n/\\n/g')
          echo "failed_test_list=$ESCAPED_CONTENT" >> $GITHUB_OUTPUT

      - name: Send build success notification
        if: ${{ success() }}
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_COLOR: '#00FF00'
        with:
          channel-id: C04KT3VL9TK
          payload: >
            {
                 "text": ":white_check_mark: *Build Succeeded!*",
                 "attachments": [
                   {
                     "color": "#00FF00",
                     "blocks": [
                       {
                         "type": "section",
                         "text": {
                           "type": "mrkdwn",
                           "text": ":white_check_mark: *Build Succeeded! : SDK API Automation Passed * \n*Repository:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`"
                         }
                       },
                       {
                         "type": "context",
                         "elements": [
                           {
                             "type": "mrkdwn",
                             "text": "Triggered by event : `${{ github.event_name }}`"
                           },
                           {
                             "type": "mrkdwn",
                             "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Logs>"
                           }
                         ]
                       }
                    ]
                   },
                  {
                    "color": "#00FF00",
                    "text": "* Allure Report ! 📊* \n<https://miniature-succotash-rwwgqwv.pages.github.io/| View Allure Report>",
                    "thumb_url": "https://avatars.githubusercontent.com/u/5879127?s=200&v=4"
                  }
                 ]
               }

      - name: Notify Slack on Error
        if: ${{ failure() && !cancelled() }}
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_COLOR: '#FF0000'
        with:
          channel-id: C04KT3VL9TK
          payload: >
            {
              "text": ":x: *Build Failed!*",
                  "attachments": [
                        {
                          "color": "#FF0000",
                          "blocks": [
                              {
                               "type": "section",
                                "text": {
                                  "type": "mrkdwn",
                                   "text": ":x: *Build Failed! : SDK API Automation Failed * <@U0495KFP44C> <@U08J3M5B2FN> \n*Repository:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`"
                                    }
                                    },
                                {
                                  "type": "section",
                                  "text": {
                                    "type": "mrkdwn",
                                      "text": ":x: *Failed Test Cases :*\n```${{steps.prepare_content.outputs.failed_test_list}}```"
                                      }
                                      },
                                {
                                  "type": "context",
                                    "elements": [
                                      {
                                      "type": "mrkdwn",
                                      "text": "Triggered by event: `${{ github.event_name }}`"
                                        },
                                      {
                                        "type": "mrkdwn",
                                        "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Logs>"
                                      }
                                    ]
                                    }
                                    ]
                                    },
                            {
                              "color": "#FF0000",
                              "text": "* Allure Report 📊* \n<https://miniature-succotash-rwwgqwv.pages.github.io/| View Allure Report>",
                              "thumb_url": "https://avatars.githubusercontent.com/u/5879127?s=200&v=4"
                            }
                          ]
            
            }




