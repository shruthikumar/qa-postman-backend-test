name: SDK API Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3,10 * * *'

permissions: write-all

env:
  BUILD_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      LOGIN_URL: "https://partner-account-noneu.truecaller.com/v1/account/login"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-     

      - name: Cleanup Report Folder
        run: rm -rf allure-results

      - name: Run SDK Test API Tests
        run: mvn clean test

      - name: Archive allure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-reports
          path: allure-results

      - name: Upload allure reports to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-allure-reports
          path: allure-results

      - name: Set up Allure
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline --save-dev

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o target/allure-report

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/allure-report


      - name: Send build success notification
        if: ${{ success() }}
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
        with:
          channel-id: C04KT3VL9TK
          payload: >
            {
                 "text": ":white_check_mark: *Build Succeeded!*",
                 "attachments": [
                   {
                     "color": "good",
                     "blocks": [
                       {
                         "type": "section",
                         "text": {
                           "type": "mrkdwn",
                           "text": ":white_check_mark: *Build Succeeded! : SDK API Automation Passed * \n*Repository:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`"
                         }
                       },
                       {
                         "type": "context",
                         "elements": [
                           {
                             "type": "mrkdwn",
                             "text": "Triggered by: `${{ github.actor }}`"
                           },
                           {
                             "type": "mrkdwn",
                             "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Logs>"
                           }
                         ]
                       }
                     ]
                   }
                 ]
               }

      - name: Notify Slack on Error
        if: ${{ failure() && !cancelled() }}
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_TOKEN }}
        with:
          channel-id: C04KT3VL9TK
          payload: >
            {
              "text": ":x: *Build Failed!*",
                  "attachments": [
                        {
                          "color": "danger",
                          "blocks": [
                              {
                               "type": "section",
                                "text": {
                                  "type": "mrkdwn",
                                   "text": ":x: *Build Failed! : SDK API Automation Failed * <@U0495KFP44C> <@U08J3M5B2FN> \n*Repository:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`"
                                    }
                                    },
                                {
                                  "type": "context",
                                    "elements": [
                                      {
                                      "type": "mrkdwn",
                                      "text": "Triggered by: `${{ github.actor }}`"
                                        },
                                      {
                                        "type": "mrkdwn",
                                        "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Logs>"
                                      }
                                    ]
                                    }
                                    ]
                                    }
                                ]
            }




